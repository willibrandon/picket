name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release.
        required: true
        type: string

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: |
            9.0.x
            10.0.301

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.28.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: docs-site/pnpm-lock.yaml

      - name: Restore
        run: dotnet restore Picket.slnx --locked-mode

      - name: Install docs dependencies
        run: pnpm --dir docs-site install --frozen-lockfile

      - name: Verify formatting
        run: dotnet format Picket.slnx --verify-no-changes --verbosity minimal

      - name: Build
        run: dotnet build Picket.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution Picket.slnx --configuration Release --no-restore

      - name: Check generated docs
        run: pnpm --dir docs-site docs:check

      - name: Smoke test GitHub Action
        id: action-smoke
        uses: ./
        with:
          path: tests/fixtures/github-secret-scanning
          cache: "false"
          report-directory: ${{ runner.temp }}/picket-action-smoke
          fail-on: never
          summary: "false"
          upload-sarif: "false"
          annotations: "false"
          setup-dotnet: "false"

      - name: Verify GitHub Action smoke outputs
        shell: pwsh
        run: |
          if ('${{ steps.action-smoke.outputs.exit-code }}' -ne '0') {
            throw "GitHub Action smoke returned exit code ${{ steps.action-smoke.outputs.exit-code }}."
          }

          if ('${{ steps.action-smoke.outputs.findings }}' -ne '0') {
            throw "GitHub Action smoke reported ${{ steps.action-smoke.outputs.findings }} findings."
          }

          $reportDirectory = Join-Path $env:RUNNER_TEMP 'picket-action-smoke'
          foreach ($fileName in @('picket.sarif', 'picket.jsonl')) {
            $path = Join-Path $reportDirectory $fileName
            if (!(Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "GitHub Action smoke did not write $fileName."
            }
          }

  build-binaries:
    name: Build binaries (${{ matrix.rid }})
    needs: validate
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            archive-extension: tar.gz
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            archive-extension: tar.gz
          - os: ubuntu-latest
            rid: linux-musl-x64
            archive-extension: tar.gz
          - os: ubuntu-24.04-arm
            rid: linux-musl-arm64
            archive-extension: tar.gz
          - os: windows-latest
            rid: win-x64
            archive-extension: zip
          - os: windows-11-arm
            rid: win-arm64
            archive-extension: zip
          - os: macos-26-intel
            rid: osx-x64
            archive-extension: tar.gz
          - os: macos-26
            rid: osx-arm64
            archive-extension: tar.gz
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: |
            9.0.x
            10.0.301

      - name: Restore
        run: dotnet restore Picket.slnx --locked-mode

      - name: Install Linux musl Native AOT dependencies
        if: startsWith(matrix.rid, 'linux-musl-')
        run: |
          sudo apt-get -o Acquire::Retries=5 -o Acquire::ForceIPv4=true update
          sudo apt-get -o Acquire::Retries=5 -o Acquire::ForceIPv4=true install -y musl-tools zstd

      - name: Build Linux musl zstandard runtime
        if: startsWith(matrix.rid, 'linux-musl-')
        shell: pwsh
        run: |
          $outputDirectory = Join-Path $env:RUNNER_TEMP "picket-zstd-${{ matrix.rid }}"
          dotnet run --file ./scripts/Build-ZstandardMusl.cs -- -OutputDirectory $outputDirectory
          "PICKET_ZSTANDARD_MUSL_LIBRARY=$(Join-Path $outputDirectory 'libzstd.so')" >> $env:GITHUB_ENV

      - name: Publish Native AOT binaries
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG
          if ($version.StartsWith('v', [StringComparison]::OrdinalIgnoreCase)) {
            $version = $version.Substring(1)
          }

          if (!($version -match '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$')) {
            throw "Release tag '$env:RELEASE_TAG' does not contain a valid NuGet version."
          }

          $publishOutput = Join-Path $env:RUNNER_TEMP "picket-publish-${{ matrix.rid }}"
          if ('${{ matrix.rid }}'.StartsWith('linux-musl-', [StringComparison]::Ordinal)) {
            $packageOutput = Join-Path $env:RUNNER_TEMP "picket-tool-packages-${{ matrix.rid }}"
            dotnet run --file ./scripts/Publish-LinuxMusl.cs -- -RuntimeIdentifier '${{ matrix.rid }}' -OutputDirectory $publishOutput -ToolPackageOutputDirectory $packageOutput -ZstandardLibrary $env:PICKET_ZSTANDARD_MUSL_LIBRARY -Version $version
          }
          else {
            dotnet publish src/Picket.Cli/Picket.Cli.csproj --configuration Release -p:PublishProfile=release-speed -p:Version=$version -p:PackageVersion=$version -r ${{ matrix.rid }} --no-restore -o $publishOutput
            dotnet publish src/Picket.Tui.Cli/Picket.Tui.Cli.csproj --configuration Release -p:PublishProfile=release-speed -p:Version=$version -p:PackageVersion=$version -r ${{ matrix.rid }} --no-restore -o $publishOutput
          }

          $symbolArtifacts = @(
            Get-ChildItem -LiteralPath $publishOutput -Recurse -Force |
              Where-Object { $_.Name -match '\.(pdb|dbg|dwarf)$' -or $_.Name.EndsWith('.dSYM', [StringComparison]::OrdinalIgnoreCase) }
          )
          if ($symbolArtifacts.Count -ne 0) {
            throw "release-speed publish produced public debug symbols: $($symbolArtifacts.FullName -join ', ')"
          }

      - name: Test Native AOT compatibility oracles
        if: ${{ !startsWith(matrix.rid, 'linux-musl-') }}
        shell: pwsh
        run: |
          $executableName = if ($IsWindows) { 'picket.exe' } else { 'picket' }
          $env:PICKET_TEST_CLI_PATH = Join-Path $env:RUNNER_TEMP "picket-publish-${{ matrix.rid }}/$executableName"
          dotnet test --project tests/Picket.Tests/Picket.Tests.csproj --configuration Release --no-restore --filter "FullyQualifiedName~Picket.Tests.CompatibilityOracleFixtureTests"

      - name: Smoke test Linux musl zstandard scan
        if: startsWith(matrix.rid, 'linux-musl-')
        shell: pwsh
        run: |
          $publishOutput = Join-Path $env:RUNNER_TEMP "picket-publish-${{ matrix.rid }}"
          $fixtureDirectory = Join-Path $env:RUNNER_TEMP "picket-zstd-smoke-${{ matrix.rid }}"
          $sourcePath = Join-Path $fixtureDirectory 'secret.txt'
          $archivePath = "$sourcePath.zst"
          $runtimeImage = 'mcr.microsoft.com/dotnet/runtime-deps@sha256:297e573be253dafcba4eee8ab29e8e05ab3c5f13f966b3537af2256864de5668'
          New-Item -ItemType Directory -Force -Path $fixtureDirectory | Out-Null
          Set-Content -LiteralPath $sourcePath -NoNewline -Encoding utf8NoBOM -Value ('aws_access_key_id = ' + 'AKIA' + 'ABCDEFGHIJKLMNOP')
          & zstd -q -f $sourcePath -o $archivePath
          if ($LASTEXITCODE -ne 0) {
            throw "zstd fixture creation failed with exit code $LASTEXITCODE."
          }

          $scanOutput = & docker run --rm --read-only --network none --user 65534:65534 --volume "${publishOutput}:/picket:ro" --volume "${fixtureDirectory}:/fixtures:ro" $runtimeImage /picket/picket scan /fixtures/secret.txt.zst --report-format jsonl --redact=100 2>&1
          $scanExitCode = $LASTEXITCODE
          $scanText = $scanOutput -join "`n"
          if ($scanText.Length -gt 4096) {
            $scanText = $scanText.Substring(0, 4096)
          }

          if ($scanExitCode -ne 1) {
            throw "musl zstandard scan returned exit code ${scanExitCode}: $scanText"
          }

          if ($scanText -notmatch '"ruleId":"aws-access-token"') {
            throw 'musl zstandard scan did not report the expected finding.'
          }

          $global:LASTEXITCODE = 0

      - name: Test Linux musl compatibility oracle
        if: startsWith(matrix.rid, 'linux-musl-')
        shell: pwsh
        run: |
          $publishOutput = Join-Path $env:RUNNER_TEMP "picket-publish-${{ matrix.rid }}"
          $inputRoot = Join-Path $PWD 'tests/fixtures/oracle-inputs/basic-dir-json'
          $expectedPath = Join-Path $PWD 'tests/fixtures/oracles/basic-dir-json/gitleaks.json'
          $outputDirectory = Join-Path $env:RUNNER_TEMP "picket-musl-oracle-${{ matrix.rid }}"
          $reportPath = Join-Path $outputDirectory 'report.json'
          $runtimeImage = 'mcr.microsoft.com/dotnet/runtime-deps@sha256:297e573be253dafcba4eee8ab29e8e05ab3c5f13f966b3537af2256864de5668'
          New-Item -ItemType Directory -Force -Path $outputDirectory | Out-Null
          & chmod 0777 $outputDirectory

          $scanOutput = & docker run --rm --read-only --network none --user 65534:65534 --workdir /fixtures --volume "${publishOutput}:/picket:ro" --volume "${inputRoot}:/fixtures:ro" --volume "${outputDirectory}:/output" $runtimeImage /picket/picket dir . -c .gitleaks.toml -f json -r /output/report.json --no-banner --no-color --redact=100 2>&1
          $scanExitCode = $LASTEXITCODE
          if ($scanExitCode -ne 1) {
            throw "musl compatibility oracle returned exit code ${scanExitCode}: $($scanOutput -join "`n")"
          }

          $expected = [Convert]::ToBase64String([IO.File]::ReadAllBytes($expectedPath))
          $actual = [Convert]::ToBase64String([IO.File]::ReadAllBytes($reportPath))
          if ($actual -ne $expected) {
            throw 'musl compatibility oracle report differs from the promoted Gitleaks report.'
          }

          $global:LASTEXITCODE = 0

      - name: Package binary archive
        id: package
        shell: pwsh
        run: |
          $rid = '${{ matrix.rid }}'
          $archiveName = "picket-$env:RELEASE_TAG-$rid.${{ matrix.archive-extension }}"
          $payload = Join-Path $env:RUNNER_TEMP "picket-payload-$rid"
          $publishOutput = Join-Path $env:RUNNER_TEMP "picket-publish-$rid"
          $staging = Join-Path $env:RUNNER_TEMP 'picket-release-assets'
          $archivePath = Join-Path $staging $archiveName

          New-Item -ItemType Directory -Force -Path $payload, $staging | Out-Null
          Copy-Item -Path (Join-Path $publishOutput '*') -Destination $payload -Recurse
          Copy-Item -LiteralPath LICENSE -Destination $payload

          if ('${{ matrix.archive-extension }}' -eq 'zip') {
            Compress-Archive -Path (Join-Path $payload '*') -DestinationPath $archivePath -Force
          }
          else {
            tar -C $payload -czf $archivePath .
          }

          $hash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumPath = "$archivePath.sha256"
          Set-Content -LiteralPath $checksumPath -Encoding utf8NoBOM -Value "$hash  $archiveName"

          "archive-path=$archivePath" >> $env:GITHUB_OUTPUT
          "checksum-path=$checksumPath" >> $env:GITHUB_OUTPUT

      - name: Pack Native AOT tool packages
        id: tool-package
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG
          if ($version.StartsWith('v', [StringComparison]::OrdinalIgnoreCase)) {
            $version = $version.Substring(1)
          }

          if (!($version -match '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$')) {
            throw "Release tag '$env:RELEASE_TAG' does not contain a valid NuGet version."
          }

          $rid = '${{ matrix.rid }}'
          $packageOutput = Join-Path $env:RUNNER_TEMP "picket-tool-packages-$rid"
          $staging = Join-Path $env:RUNNER_TEMP 'picket-release-assets'
          $archiveName = "picket-$env:RELEASE_TAG-nuget-$rid.zip"
          $archivePath = Join-Path $staging $archiveName

          New-Item -ItemType Directory -Force -Path $packageOutput, $staging | Out-Null
          if (!$rid.StartsWith('linux-musl-', [StringComparison]::Ordinal)) {
            dotnet pack src/Picket.Cli/Picket.Cli.csproj --configuration Release -p:PublishProfile=release-speed -p:Version=$version -p:PackageVersion=$version -r $rid --no-restore -o $packageOutput
            dotnet pack src/Picket.Tui.Cli/Picket.Tui.Cli.csproj --configuration Release -p:PublishProfile=release-speed -p:Version=$version -p:PackageVersion=$version -r $rid --no-restore -o $packageOutput
          }

          Compress-Archive -Path (Join-Path $packageOutput '*') -DestinationPath $archivePath -Force
          $hash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumPath = "$archivePath.sha256"
          Set-Content -LiteralPath $checksumPath -Encoding utf8NoBOM -Value "$hash  $archiveName"

          "archive-path=$archivePath" >> $env:GITHUB_OUTPUT
          "checksum-path=$checksumPath" >> $env:GITHUB_OUTPUT

      - name: Generate binary artifact attestation
        uses: actions/attest@v4.2.0
        with:
          subject-path: ${{ steps.package.outputs.archive-path }}

      - name: Generate Native AOT tool package attestation
        uses: actions/attest@v4.2.0
        with:
          subject-path: ${{ steps.tool-package.outputs.archive-path }}

      - name: Upload binary release assets
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-binaries-${{ matrix.rid }}
          path: |
            ${{ steps.package.outputs.archive-path }}
            ${{ steps.package.outputs.checksum-path }}
          if-no-files-found: error

      - name: Upload Native AOT tool package assets
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-nuget-${{ matrix.rid }}
          path: |
            ${{ steps.tool-package.outputs.archive-path }}
            ${{ steps.tool-package.outputs.checksum-path }}
          if-no-files-found: error

  build-packages:
    name: Build NuGet package archive
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: |
            9.0.x
            10.0.301

      - name: Restore
        run: dotnet restore Picket.slnx --locked-mode

      - name: Pack public packages
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG
          if ($version.StartsWith('v', [StringComparison]::OrdinalIgnoreCase)) {
            $version = $version.Substring(1)
          }

          if (!($version -match '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$')) {
            throw "Release tag '$env:RELEASE_TAG' does not contain a valid NuGet version."
          }

          $packageOutput = Join-Path $env:RUNNER_TEMP 'picket-packages'
          New-Item -ItemType Directory -Force -Path $packageOutput | Out-Null

          dotnet pack src/Picket.Rules/Picket.Rules.csproj --configuration Release -p:Version=$version -p:PackageVersion=$version -o $packageOutput
          dotnet pack src/Picket.Engine/Picket.Engine.csproj --configuration Release -p:Version=$version -p:PackageVersion=$version -o $packageOutput
          dotnet pack src/Picket.Compat/Picket.Compat.csproj --configuration Release -p:Version=$version -p:PackageVersion=$version -o $packageOutput
          dotnet pack src/Picket.Report/Picket.Report.csproj --configuration Release -p:Version=$version -p:PackageVersion=$version -o $packageOutput
          dotnet pack src/Picket.Security/Picket.Security.csproj --configuration Release -p:Version=$version -p:PackageVersion=$version -o $packageOutput
          dotnet pack src/Picket.Cli/Picket.Cli.csproj --configuration Release -p:Version=$version -p:PackageVersion=$version -p:IncludeSymbols=false -o $packageOutput
          dotnet pack src/Picket.Tui.Cli/Picket.Tui.Cli.csproj --configuration Release -p:Version=$version -p:PackageVersion=$version -p:IncludeSymbols=false -o $packageOutput

      - name: Package NuGet artifacts
        id: package
        shell: pwsh
        run: |
          $packageOutput = Join-Path $env:RUNNER_TEMP 'picket-packages'
          $staging = Join-Path $env:RUNNER_TEMP 'picket-release-assets'
          $archiveName = "picket-$env:RELEASE_TAG-nuget.zip"
          $archivePath = Join-Path $staging $archiveName

          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Compress-Archive -Path (Join-Path $packageOutput '*') -DestinationPath $archivePath -Force

          $hash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumPath = "$archivePath.sha256"
          Set-Content -LiteralPath $checksumPath -Encoding utf8NoBOM -Value "$hash  $archiveName"

          "archive-path=$archivePath" >> $env:GITHUB_OUTPUT
          "checksum-path=$checksumPath" >> $env:GITHUB_OUTPUT

      - name: Generate NuGet artifact attestation
        uses: actions/attest@v4.2.0
        with:
          subject-path: ${{ steps.package.outputs.archive-path }}

      - name: Upload NuGet release assets
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-nuget
          path: |
            ${{ steps.package.outputs.archive-path }}
            ${{ steps.package.outputs.checksum-path }}
          if-no-files-found: error

  publish-nuget:
    name: Publish NuGet packages
    needs:
      - build-binaries
      - build-packages
      - publish-release
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download NuGet artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $downloadDirectory = Join-Path $env:RUNNER_TEMP 'picket-nuget-artifacts'
          New-Item -ItemType Directory -Force -Path $downloadDirectory | Out-Null
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY --pattern 'release-nuget*' --dir $downloadDirectory
          if ($LASTEXITCODE -ne 0) {
            throw 'NuGet artifact download failed.'
          }

          $files = @(Get-ChildItem -LiteralPath $downloadDirectory -Recurse -File)
          if ($files.Count -eq 0) {
            throw 'NuGet artifact download was empty.'
          }

          foreach ($file in $files) {
            $destination = Join-Path 'dist' $file.Name
            if (Test-Path -LiteralPath $destination) {
              throw "NuGet artifacts contain duplicate file name '$($file.Name)'."
            }

            Move-Item -LiteralPath $file.FullName -Destination $destination
          }

      - name: Set up .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.301

      - name: Collect NuGet packages
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem -LiteralPath dist -Filter 'picket-*-nuget*.zip' -File | Sort-Object Name)
          if ($archives.Count -eq 0) {
            throw 'NuGet package archives were not downloaded.'
          }

          $packageOutput = Join-Path $env:RUNNER_TEMP 'picket-nuget-publish'
          New-Item -ItemType Directory -Force -Path $packageOutput | Out-Null
          foreach ($archive in $archives) {
            Expand-Archive -LiteralPath $archive.FullName -DestinationPath $packageOutput -Force
          }

          $packages = @(Get-ChildItem -LiteralPath $packageOutput -Filter '*.nupkg' -File)
          if ($packages.Count -eq 0) {
            throw 'NuGet package archive did not contain .nupkg files.'
          }

          "PICKET_NUGET_PACKAGE_OUTPUT=$packageOutput" >> $env:GITHUB_ENV

      - name: Verify local dotnet tool install
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v', 'V')
          $packageOutput = $env:PICKET_NUGET_PACKAGE_OUTPUT
          $toolPath = Join-Path $env:RUNNER_TEMP 'picket-tool-install'
          $configPath = Join-Path $env:RUNNER_TEMP 'picket-tool-install.NuGet.Config'
          $escapedPackageOutput = [Security.SecurityElement]::Escape($packageOutput)
          $config = @"
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="release-artifacts" value="$escapedPackageOutput" />
            </packageSources>
          </configuration>
          "@
          [IO.File]::WriteAllText($configPath, $config, [Text.UTF8Encoding]::new($false))

          dotnet tool install Picket --tool-path $toolPath --version $version --configfile $configPath
          if ($LASTEXITCODE -ne 0) {
            throw 'Local Picket tool installation failed.'
          }

          dotnet tool install Picket.Tui.Cli --tool-path $toolPath --version $version --configfile $configPath
          if ($LASTEXITCODE -ne 0) {
            throw 'Local Picket TUI tool installation failed.'
          }

          $picket = Join-Path $toolPath 'picket'
          $picketTui = Join-Path $toolPath 'picket-tui'
          & $picket version
          if ($LASTEXITCODE -ne 0) {
            throw 'Installed Picket tool smoke test failed.'
          }

          & $picketTui --help
          if ($LASTEXITCODE -ne 0) {
            throw 'Installed Picket TUI tool smoke test failed.'
          }

          $previousPath = $env:PATH
          try {
            $env:PATH = [string]::Concat($toolPath, [IO.Path]::PathSeparator, $previousPath)
            $missingReport = Join-Path $env:RUNNER_TEMP 'picket-missing-report.json'
            $startInfo = [Diagnostics.ProcessStartInfo]::new()
            $startInfo.FileName = $picket
            $startInfo.UseShellExecute = $false
            $startInfo.RedirectStandardOutput = $true
            $startInfo.RedirectStandardError = $true
            [void]$startInfo.ArgumentList.Add('tui')
            [void]$startInfo.ArgumentList.Add($missingReport)

            $companionProcess = [Diagnostics.Process]::Start($startInfo)
            if ($null -eq $companionProcess) {
              throw 'Picket TUI companion smoke test could not start.'
            }

            try {
              $standardOutput = $companionProcess.StandardOutput.ReadToEndAsync()
              $standardError = $companionProcess.StandardError.ReadToEndAsync()
              $companionProcess.WaitForExit()
              $companionExitCode = $companionProcess.ExitCode
              $companionOutput = @(
                $standardOutput.GetAwaiter().GetResult(),
                $standardError.GetAwaiter().GetResult()
              )
            }
            finally {
              $companionProcess.Dispose()
            }
          }
          finally {
            $env:PATH = $previousPath
          }

          if ($companionExitCode -ne 1) {
            throw "Picket TUI companion smoke test returned exit code $companionExitCode."
          }

          $companionText = $companionOutput -join "`n"
          if ($companionText.Contains('requires the picket-tui companion executable', [StringComparison]::Ordinal)) {
            throw "Picket did not launch the installed TUI companion:`n$companionText"
          }

      - name: Publish packages to NuGet
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) {
            throw 'NUGET_API_KEY is required to publish NuGet packages.'
          }

          $packageOutput = $env:PICKET_NUGET_PACKAGE_OUTPUT
          $packages = @(Get-ChildItem -LiteralPath $packageOutput -Filter '*.nupkg' -File | Sort-Object Name)
          $pointerPackages = @($packages | Where-Object {
            $_.Name -match '^Picket\.\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?\.nupkg$' -or
            $_.Name -match '^Picket\.Tui\.Cli\.\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?\.nupkg$'
          })
          $pointerPaths = @($pointerPackages | ForEach-Object FullName)
          $nonPointerPackages = @($packages | Where-Object { $pointerPaths -notcontains $_.FullName })
          $libraryPackagePrefixes = @(
            'Picket.Rules.',
            'Picket.Engine.',
            'Picket.Compat.',
            'Picket.Report.',
            'Picket.Security.'
          )
          $libraryPackages = @(
            foreach ($prefix in $libraryPackagePrefixes) {
              $nonPointerPackages | Where-Object { $_.Name.StartsWith($prefix, [StringComparison]::Ordinal) }
            }
          )
          $libraryPaths = @($libraryPackages | ForEach-Object FullName)
          $runtimePackages = @($nonPointerPackages | Where-Object { $libraryPaths -notcontains $_.FullName })

          foreach ($package in $libraryPackages) {
            dotnet nuget push $package.FullName --source https://api.nuget.org/v3/index.json --api-key $env:NUGET_API_KEY --skip-duplicate
          }

          foreach ($package in $runtimePackages) {
            dotnet nuget push $package.FullName --source https://api.nuget.org/v3/index.json --api-key $env:NUGET_API_KEY --skip-duplicate
          }

          foreach ($package in $pointerPackages) {
            dotnet nuget push $package.FullName --source https://api.nuget.org/v3/index.json --api-key $env:NUGET_API_KEY --skip-duplicate
          }

          $symbols = @(Get-ChildItem -LiteralPath $packageOutput -Filter '*.snupkg' -File | Sort-Object Name)
          foreach ($symbol in $symbols) {
            dotnet nuget push $symbol.FullName --source https://api.nuget.org/v3/index.json --api-key $env:NUGET_API_KEY --skip-duplicate
          }

  build-msi:
    name: Build Windows MSI installer (${{ matrix.rid }})
    needs: build-binaries
    runs-on: ${{ matrix.os }}
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            architecture: x64
          - os: windows-11-arm
            rid: win-arm64
            architecture: arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.301

      - name: Install WiX
        shell: pwsh
        run: dotnet tool install --tool-path (Join-Path $env:RUNNER_TEMP 'wix') wix --version 6.0.2

      - name: Download Windows release archive
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY --name 'release-binaries-${{ matrix.rid }}' --dir dist
          if ($LASTEXITCODE -ne 0) {
            throw 'Windows release archive download failed.'
          }

      - name: Build MSI installer
        id: msi
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG
          if ($version.StartsWith('v', [StringComparison]::OrdinalIgnoreCase)) {
            $version = $version.Substring(1)
          }

          if (!($version -match '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$')) {
            throw "Release tag '$env:RELEASE_TAG' does not contain a valid MSI version."
          }

          if ($version.Contains('-', [StringComparison]::Ordinal)) {
            Write-Host "Skipping MSI installers for prerelease tag $env:RELEASE_TAG because Windows Installer ProductVersion does not support prerelease labels."
            "created=false" >> $env:GITHUB_OUTPUT
            return
          }

          $wix = Join-Path $env:RUNNER_TEMP 'wix\wix.exe'
          $staging = Join-Path $env:RUNNER_TEMP 'picket-release-assets'
          New-Item -ItemType Directory -Force -Path $staging | Out-Null

          $rid = '${{ matrix.rid }}'
          $architecture = '${{ matrix.architecture }}'
          $archiveName = "picket-$env:RELEASE_TAG-$rid.zip"
          $archive = Get-ChildItem -LiteralPath dist -Filter $archiveName -File | Select-Object -First 1
          if ($null -eq $archive) {
            throw "Windows release archive $archiveName was not downloaded."
          }

          $payload = Join-Path $env:RUNNER_TEMP "picket-msi-payload-$rid"
          New-Item -ItemType Directory -Force -Path $payload | Out-Null
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $payload -Force

          foreach ($fileName in @('picket.exe', 'picket-tui.exe', 'libzstd.dll', 'LICENSE', 'THIRD-PARTY-NOTICES.txt')) {
            $path = Join-Path $payload $fileName
            if (!(Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "$archiveName does not contain $fileName."
            }
          }

          $msiName = "picket-$env:RELEASE_TAG-$rid.msi"
          $msiPath = Join-Path $staging $msiName
          & $wix build packaging/msi/Picket.wxs -arch $architecture -d "Version=$version" -d "PayloadDir=$payload" -out $msiPath -pdbtype none
          if ($LASTEXITCODE -ne 0) {
            throw "WiX failed to build $msiName."
          }

          $installRoot = Join-Path $env:RUNNER_TEMP "picket-msi-install-$rid"
          $installArguments = "/i `"$msiPath`" /qn /norestart INSTALLFOLDER=`"$installRoot`""
          $installProcess = Start-Process -FilePath 'msiexec.exe' -ArgumentList $installArguments -Wait -PassThru -WindowStyle Hidden
          if ($installProcess.ExitCode -ne 0) {
            throw "Installing $msiName failed with exit code $($installProcess.ExitCode)."
          }

          try {
            foreach ($fileName in @('picket.exe', 'picket-tui.exe', 'libzstd.dll', 'LICENSE', 'THIRD-PARTY-NOTICES.txt')) {
              if (!(Test-Path -LiteralPath (Join-Path $installRoot $fileName) -PathType Leaf)) {
                throw "$msiName did not install $fileName."
              }
            }

            $zstandardFixture = Join-Path $env:RUNNER_TEMP "picket-msi-zstd-$rid.zst"
            [IO.File]::WriteAllBytes($zstandardFixture, [Convert]::FromBase64String('KLUv/SQoQQEAYXdzX2FjY2Vzc19rZXlfaWQgPSBBS0lBQUJDREVGR0hJSktMTU5PUJrlerI='))
            $scanOutput = & (Join-Path $installRoot 'picket.exe') scan $zstandardFixture --report-format jsonl --redact=100 2>&1
            $scanExitCode = $LASTEXITCODE
            $scanText = $scanOutput -join "`n"
            if ($scanExitCode -ne 1 -or $scanText -notmatch '"ruleId":"aws-access-token"') {
              throw "$msiName zstandard smoke scan failed with exit code ${scanExitCode}: $scanText"
            }

            $global:LASTEXITCODE = 0
          }
          finally {
            $uninstallArguments = "/x `"$msiPath`" /qn /norestart"
            $uninstallProcess = Start-Process -FilePath 'msiexec.exe' -ArgumentList $uninstallArguments -Wait -PassThru -WindowStyle Hidden
            if ($uninstallProcess.ExitCode -ne 0) {
              throw "Uninstalling $msiName failed with exit code $($uninstallProcess.ExitCode)."
            }
          }

          $hash = (Get-FileHash -LiteralPath $msiPath -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$msiPath.sha256" -Encoding utf8NoBOM -Value "$hash  $msiName"
          "created=true" >> $env:GITHUB_OUTPUT

      - name: Generate MSI artifact attestation
        if: steps.msi.outputs.created == 'true'
        uses: actions/attest@v4.2.0
        with:
          subject-path: ${{ runner.temp }}/picket-release-assets/*.msi

      - name: Upload MSI release assets
        if: steps.msi.outputs.created == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-msi-${{ matrix.rid }}
          path: |
            ${{ runner.temp }}/picket-release-assets/*.msi
            ${{ runner.temp }}/picket-release-assets/*.msi.sha256
          if-no-files-found: error

  build-azure-devops-extension:
    name: Build Azure DevOps VSIX
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: azure-devops/package-lock.json

      - name: Install Azure DevOps packaging dependencies
        working-directory: azure-devops
        run: |
          npm ci --ignore-scripts --no-fund
          npm audit --audit-level=low

      - name: Test Azure DevOps task
        run: node --test azure-devops/tasks/PicketScanV1/index.test.js

      - name: Build Azure DevOps VSIX
        id: vsix
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG
          if ($version.StartsWith('v', [StringComparison]::OrdinalIgnoreCase)) {
            $version = $version.Substring(1)
          }

          if (!($version -match '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$')) {
            throw "Release tag '$env:RELEASE_TAG' does not contain a valid extension version."
          }

          if ($version.Contains('-', [StringComparison]::Ordinal)) {
            Write-Host "Skipping Azure DevOps VSIX for prerelease tag $env:RELEASE_TAG because extension manifest versions do not support prerelease labels."
            "created=false" >> $env:GITHUB_OUTPUT
            return
          }

          $staging = Join-Path $env:RUNNER_TEMP 'picket-release-assets'
          $packageOutput = Join-Path $env:RUNNER_TEMP 'picket-azure-devops-vsix'
          New-Item -ItemType Directory -Force -Path $staging, $packageOutput | Out-Null

          Push-Location azure-devops
          try {
            $override = @{ version = $version } | ConvertTo-Json -Compress
            npm exec -- tfx extension create --manifest-globs vss-extension.json --output-path $packageOutput --rev-version false --override $override --no-color
            if ($LASTEXITCODE -ne 0) {
              throw 'Azure DevOps VSIX packaging failed.'
            }
          }
          finally {
            Pop-Location
          }

          $vsix = Get-ChildItem -LiteralPath $packageOutput -Filter '*.vsix' -File | Select-Object -First 1
          if ($null -eq $vsix) {
            throw 'Azure DevOps VSIX package was not produced.'
          }

          $vsixName = "picket-$env:RELEASE_TAG-azure-devops.vsix"
          $vsixPath = Join-Path $staging $vsixName
          Copy-Item -LiteralPath $vsix.FullName -Destination $vsixPath -Force

          $hash = (Get-FileHash -LiteralPath $vsixPath -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$vsixPath.sha256" -Encoding utf8NoBOM -Value "$hash  $vsixName"
          "created=true" >> $env:GITHUB_OUTPUT

      - name: Generate Azure DevOps VSIX artifact attestation
        if: steps.vsix.outputs.created == 'true'
        uses: actions/attest@v4.2.0
        with:
          subject-path: ${{ runner.temp }}/picket-release-assets/*.vsix

      - name: Upload Azure DevOps VSIX release assets
        if: steps.vsix.outputs.created == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-azure-devops-vsix
          path: |
            ${{ runner.temp }}/picket-release-assets/*.vsix
            ${{ runner.temp }}/picket-release-assets/*.vsix.sha256
          if-no-files-found: error

  validate-container-images:
    name: Validate container image (${{ matrix.rid }})
    needs: build-binaries
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            platform: linux/amd64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            platform: linux/arm64
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download native Linux archive
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY --name 'release-binaries-${{ matrix.rid }}' --dir dist
          if ($LASTEXITCODE -ne 0) {
            throw 'Native Linux archive download failed.'
          }

      - name: Build and smoke test image
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG
          if ($version.StartsWith('v', [StringComparison]::OrdinalIgnoreCase)) {
            $version = $version.Substring(1)
          }

          if (!($version -match '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$')) {
            throw "Release tag '$env:RELEASE_TAG' does not contain a valid container version."
          }

          $archive = Get-ChildItem -LiteralPath dist -Filter "picket-$env:RELEASE_TAG-${{ matrix.rid }}.tar.gz" -File | Select-Object -First 1
          if ($null -eq $archive) {
            throw 'Native Linux release archive was not downloaded.'
          }

          $context = Join-Path $env:RUNNER_TEMP 'picket-container-context'
          New-Item -ItemType Directory -Force -Path $context | Out-Null
          tar -C $context -xzf $archive.FullName
          if ($LASTEXITCODE -ne 0) {
            throw 'Native Linux release archive extraction failed.'
          }

          foreach ($fileName in @('picket', 'picket-tui', 'libzstd.so', 'LICENSE', 'THIRD-PARTY-NOTICES.txt')) {
            if (!(Test-Path -LiteralPath (Join-Path $context $fileName) -PathType Leaf)) {
              throw "Container payload does not contain $fileName."
            }
          }

          $image = 'picket-release-validation:${{ matrix.rid }}'
          $revision = (git rev-parse HEAD).Trim()
          docker buildx build --file packaging/container/Dockerfile --platform '${{ matrix.platform }}' --build-arg "VERSION=$version" --label "org.opencontainers.image.revision=$revision" --tag $image --load $context
          if ($LASTEXITCODE -ne 0) {
            throw 'Container image build failed.'
          }

          docker run --rm --network none $image version
          if ($LASTEXITCODE -ne 0) {
            throw 'Container scanner smoke test failed.'
          }

          docker run --rm --network none --entrypoint /bin/sh $image -c 'test -x /usr/local/bin/picket-tui && test -f /usr/local/bin/libzstd.so && test -f /licenses/Picket/THIRD-PARTY-NOTICES.txt'
          if ($LASTEXITCODE -ne 0) {
            throw 'Container payload smoke test failed.'
          }

  publish-container-architectures:
    name: Publish container architecture (${{ matrix.rid }})
    needs:
      - build-binaries
      - publish-release
      - validate-container-images
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            platform: linux/amd64
            suffix: amd64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            platform: linux/arm64
            suffix: arm64
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver: docker-container

      - name: Download native Linux archive
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY --name 'release-binaries-${{ matrix.rid }}' --dir dist
          if ($LASTEXITCODE -ne 0) {
            throw 'Native Linux archive download failed.'
          }

      - name: Log in to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      - name: Publish architecture image
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG
          if ($version.StartsWith('v', [StringComparison]::OrdinalIgnoreCase)) {
            $version = $version.Substring(1)
          }

          if (!($version -match '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$')) {
            throw "Release tag '$env:RELEASE_TAG' does not contain a valid container version."
          }

          $archive = Get-ChildItem -LiteralPath dist -Filter "picket-$env:RELEASE_TAG-${{ matrix.rid }}.tar.gz" -File | Select-Object -First 1
          if ($null -eq $archive) {
            throw 'Native Linux release archive was not downloaded.'
          }

          $context = Join-Path $env:RUNNER_TEMP 'picket-container-context'
          New-Item -ItemType Directory -Force -Path $context | Out-Null
          tar -C $context -xzf $archive.FullName
          if ($LASTEXITCODE -ne 0) {
            throw 'Native Linux release archive extraction failed.'
          }

          $repository = $env:GITHUB_REPOSITORY.ToLowerInvariant()
          $image = "ghcr.io/$repository`:$version-${{ matrix.suffix }}"
          $revision = (git rev-parse HEAD).Trim()
          docker buildx build --file packaging/container/Dockerfile --platform '${{ matrix.platform }}' --build-arg "VERSION=$version" --label "org.opencontainers.image.revision=$revision" --label "org.opencontainers.image.created=$((Get-Date).ToUniversalTime().ToString('o'))" --tag $image --sbom=true --provenance=true --push $context
          if ($LASTEXITCODE -ne 0) {
            throw 'Container architecture publish failed.'
          }

  publish-container:
    name: Publish container manifest
    needs: publish-container-architectures
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      - name: Publish version manifests
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG
          if ($version.StartsWith('v', [StringComparison]::OrdinalIgnoreCase)) {
            $version = $version.Substring(1)
          }

          $repository = $env:GITHUB_REPOSITORY.ToLowerInvariant()
          $image = "ghcr.io/$repository"
          docker buildx imagetools create --tag "$image`:$env:RELEASE_TAG" --tag "$image`:$version" "$image`:$version-amd64" "$image`:$version-arm64"
          if ($LASTEXITCODE -ne 0) {
            throw 'Container manifest publish failed.'
          }

          docker buildx imagetools inspect "$image`:$version"

  publish-release:
    name: Publish GitHub Release
    needs:
      - build-binaries
      - build-packages
      - build-azure-devops-extension
      - build-msi
      - validate-container-images
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.301

      - name: Download release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $downloadDirectory = Join-Path $env:RUNNER_TEMP 'picket-release-artifacts'
          New-Item -ItemType Directory -Force -Path $downloadDirectory | Out-Null
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY --pattern 'release-*' --dir $downloadDirectory
          if ($LASTEXITCODE -ne 0) {
            throw 'Release artifact download failed.'
          }

          $files = @(Get-ChildItem -LiteralPath $downloadDirectory -Recurse -File)
          if ($files.Count -eq 0) {
            throw 'Release artifact download was empty.'
          }

          foreach ($file in $files) {
            $destination = Join-Path 'dist' $file.Name
            if (Test-Path -LiteralPath $destination) {
              throw "Release artifacts contain duplicate file name '$($file.Name)'."
            }

            Move-Item -LiteralPath $file.FullName -Destination $destination
          }

      - name: Build release utility apps
        shell: pwsh
        run: |
          dotnet build ./scripts/Generate-PackageManagerManifests.cs --nologo --verbosity quiet
          dotnet build ./scripts/Generate-ReleaseArtifactManifest.cs --nologo --verbosity quiet

      - name: Write aggregate checksums
        shell: pwsh
        run: |
          $assets = Get-ChildItem -LiteralPath dist -File |
            Where-Object {
              !$_.Name.EndsWith('.sha256', [StringComparison]::Ordinal) -and
              !$_.Name.Equals('checksums.txt', [StringComparison]::Ordinal)
            } |
            Sort-Object Name

          $lines = foreach ($asset in $assets) {
            $hash = (Get-FileHash -LiteralPath $asset.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($asset.Name)"
          }

          Set-Content -LiteralPath (Join-Path 'dist' 'checksums.txt') -Encoding utf8NoBOM -Value $lines

      - name: Generate package-manager manifests
        shell: pwsh
        run: |
          $manifestRoot = Join-Path $env:RUNNER_TEMP 'picket-package-manager-manifests'
          dotnet run --file ./scripts/Generate-PackageManagerManifests.cs --no-build -- -ReleaseTag $env:RELEASE_TAG -ChecksumsPath (Join-Path 'dist' 'checksums.txt') -OutputDirectory $manifestRoot -Clean

          $archiveName = "picket-$env:RELEASE_TAG-package-manager-manifests.zip"
          $archivePath = Join-Path 'dist' $archiveName
          Compress-Archive -Path (Join-Path $manifestRoot '*') -DestinationPath $archivePath -Force

          $hash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$archivePath.sha256" -Encoding utf8NoBOM -Value "$hash  $archiveName"

      - name: Generate release artifact manifest
        shell: pwsh
        run: dotnet run --file ./scripts/Generate-ReleaseArtifactManifest.cs --no-build -- -Directory dist -ReleaseTag $env:RELEASE_TAG

      - name: Refresh aggregate checksums
        shell: pwsh
        run: |
          $assets = Get-ChildItem -LiteralPath dist -File |
            Where-Object {
              !$_.Name.EndsWith('.sha256', [StringComparison]::Ordinal) -and
              !$_.Name.Equals('checksums.txt', [StringComparison]::Ordinal)
            } |
            Sort-Object Name

          $lines = foreach ($asset in $assets) {
            $hash = (Get-FileHash -LiteralPath $asset.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($asset.Name)"
          }

          Set-Content -LiteralPath (Join-Path 'dist' 'checksums.txt') -Encoding utf8NoBOM -Value $lines

      - name: Generate checksum attestation
        uses: actions/attest@v4.2.0
        with:
          subject-path: dist/checksums.txt

      - name: Generate release artifact manifest attestation
        uses: actions/attest@v4.2.0
        with:
          subject-path: dist/release-artifacts.json

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem -LiteralPath dist -File | Sort-Object Name
          if ($assets.Count -eq 0) {
            throw 'No release assets were produced.'
          }

          $assetPaths = @($assets | ForEach-Object { $_.FullName })
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY >$null 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG @assetPaths --repo $env:GITHUB_REPOSITORY --clobber
          }
          else {
            gh release create $env:RELEASE_TAG @assetPaths --repo $env:GITHUB_REPOSITORY --verify-tag --title "Picket $env:RELEASE_TAG" --notes "Release artifacts include SHA-256 checksums, package-size metadata, and GitHub artifact attestations."
          }

  update-homebrew:
    name: Update Homebrew tap
    if: ${{ !contains(github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name, '-') }}
    needs:
      - publish-nuget
      - publish-release
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out Homebrew tap
        uses: actions/checkout@v7.0.1
        with:
          repository: willibrandon/homebrew-tap
          ref: main
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Download generated package-manager manifests
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $downloadDirectory = Join-Path $env:RUNNER_TEMP 'picket-package-managers'
          $manifestDirectory = Join-Path $env:RUNNER_TEMP 'picket-package-manager-manifests'
          New-Item -ItemType Directory -Force -Path $downloadDirectory | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern "picket-$env:RELEASE_TAG-package-manager-manifests.zip" --dir $downloadDirectory
          if ($LASTEXITCODE -ne 0) {
            throw 'Package-manager manifest download failed.'
          }

          $archive = Get-ChildItem -LiteralPath $downloadDirectory -Filter '*.zip' -File -ErrorAction Stop
          if ($archive.Count -ne 1) {
            throw "Expected one package-manager manifest archive; found $($archive.Count)."
          }

          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $manifestDirectory -Force
          "PICKET_PACKAGE_MANAGER_MANIFESTS=$manifestDirectory" >> $env:GITHUB_ENV

      - name: Update formula and tap catalog
        shell: pwsh
        run: |
          $formulaSource = Join-Path $env:PICKET_PACKAGE_MANAGER_MANIFESTS 'homebrew/picket.rb'
          $formulaDestination = Join-Path $PWD 'homebrew-tap/Formula/picket.rb'
          if (!(Test-Path -LiteralPath $formulaSource -PathType Leaf)) {
            throw "Generated Homebrew formula was not found: $formulaSource"
          }

          Copy-Item -LiteralPath $formulaSource -Destination $formulaDestination -Force

          $readmePath = Join-Path $PWD 'homebrew-tap/README.md'
          $readme = [IO.File]::ReadAllText($readmePath).ReplaceLineEndings("`n")
          if (!$readme.Contains('| [picket](https://github.com/willibrandon/picket) |', [StringComparison]::Ordinal)) {
            $replacements = @(
              @{
                Old = '| [scout](https://github.com/willibrandon/scout) | Feature-complete port of ripgrep to .NET Native AOT |'
                New = "| [picket](https://github.com/willibrandon/picket) | Native AOT secrets scanner |`n| [scout](https://github.com/willibrandon/scout) | Feature-complete port of ripgrep to .NET Native AOT |"
              },
              @{
                Old = "brew install scout`n"
                New = "brew install picket`nbrew install scout`n"
              },
              @{
                Old = "brew install willibrandon/tap/scout`n"
                New = "brew install willibrandon/tap/picket`nbrew install willibrandon/tap/scout`n"
              },
              @{
                Old = "brew upgrade scout`n"
                New = "brew upgrade picket`nbrew upgrade scout`n"
              },
              @{
                Old = "### scout`n"
                New = "### picket`n`n| Platform | Architecture | Binaries |`n|----------|--------------|----------|`n| macOS | Apple Silicon (arm64) | picket, picket-tui |`n| macOS | Intel (x86_64) | picket, picket-tui |`n| Linux | arm64 | picket, picket-tui |`n| Linux | x86_64 | picket, picket-tui |`n`n### scout`n"
              },
              @{
                Old = "xattr -d com.apple.quarantine `$(which scout)`n"
                New = "xattr -d com.apple.quarantine `$(which picket)`nxattr -d com.apple.quarantine `$(which picket-tui)`nxattr -d com.apple.quarantine `$(which scout)`n"
              },
              @{
                Old = '- [scout issues](https://github.com/willibrandon/scout/issues)'
                New = "- [picket issues](https://github.com/willibrandon/picket/issues)`n- [scout issues](https://github.com/willibrandon/scout/issues)"
              }
            )

            foreach ($replacement in $replacements) {
              if (!$readme.Contains($replacement.Old, [StringComparison]::Ordinal)) {
                throw "Homebrew README marker was not found: $($replacement.Old)"
              }

              $readme = $readme.Replace($replacement.Old, $replacement.New, [StringComparison]::Ordinal)
            }

            [IO.File]::WriteAllText($readmePath, $readme, [Text.UTF8Encoding]::new($false))
          }

      - name: Validate Homebrew formula
        shell: pwsh
        run: |
          ruby -c homebrew-tap/Formula/picket.rb
          if ($LASTEXITCODE -ne 0) {
            throw 'Homebrew formula syntax validation failed.'
          }

          $tapName = 'willibrandon/tap'
          $tapped = $false
          $installed = $false
          try {
            brew tap --custom-remote $tapName (Resolve-Path homebrew-tap)
            if ($LASTEXITCODE -ne 0) {
              throw 'Homebrew tap registration failed.'
            }

            $tapped = $true
            $tapRepository = (brew --repository $tapName).Trim()
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($tapRepository)) {
              throw 'Homebrew tap location could not be resolved.'
            }

            Copy-Item -LiteralPath homebrew-tap/Formula/picket.rb -Destination (Join-Path $tapRepository 'Formula/picket.rb') -Force
            brew install "$tapName/picket"
            if ($LASTEXITCODE -ne 0) {
              throw 'Homebrew formula installation failed.'
            }

            $installed = $true
            brew test "$tapName/picket"
            if ($LASTEXITCODE -ne 0) {
              throw 'Homebrew formula test failed.'
            }
          }
          finally {
            if ($installed) {
              brew uninstall --force picket
            }

            if ($tapped) {
              brew untap --force $tapName
            }
          }

      - name: Commit and push Homebrew tap
        shell: pwsh
        run: |
          git -C homebrew-tap config user.name 'github-actions[bot]'
          git -C homebrew-tap config user.email 'github-actions[bot]@users.noreply.github.com'
          git -C homebrew-tap add Formula/picket.rb README.md
          git -C homebrew-tap diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Homebrew tap is already current.'
            exit 0
          }

          $version = $env:RELEASE_TAG.TrimStart('v', 'V')
          git -C homebrew-tap commit -m "Update picket to $version"
          git -C homebrew-tap push origin HEAD:main

  update-scoop:
    name: Update Scoop bucket
    if: ${{ !contains(github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name, '-') }}
    needs:
      - publish-nuget
      - publish-release
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out Scoop bucket
        uses: actions/checkout@v7.0.1
        with:
          repository: willibrandon/scoop-bucket
          ref: main
          token: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          path: scoop-bucket

      - name: Download generated package-manager manifests
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $downloadDirectory = Join-Path $env:RUNNER_TEMP 'picket-package-managers'
          $manifestDirectory = Join-Path $env:RUNNER_TEMP 'picket-package-manager-manifests'
          New-Item -ItemType Directory -Force -Path $downloadDirectory | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern "picket-$env:RELEASE_TAG-package-manager-manifests.zip" --dir $downloadDirectory
          if ($LASTEXITCODE -ne 0) {
            throw 'Package-manager manifest download failed.'
          }

          $archive = Get-ChildItem -LiteralPath $downloadDirectory -Filter '*.zip' -File -ErrorAction Stop
          if ($archive.Count -ne 1) {
            throw "Expected one package-manager manifest archive; found $($archive.Count)."
          }

          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $manifestDirectory -Force
          "PICKET_PACKAGE_MANAGER_MANIFESTS=$manifestDirectory" >> $env:GITHUB_ENV

      - name: Update manifest and bucket catalog
        shell: pwsh
        run: |
          $manifestSource = Join-Path $env:PICKET_PACKAGE_MANAGER_MANIFESTS 'scoop/picket.json'
          $manifestDestination = Join-Path $PWD 'scoop-bucket/bucket/picket.json'
          if (!(Test-Path -LiteralPath $manifestSource -PathType Leaf)) {
            throw "Generated Scoop manifest was not found: $manifestSource"
          }

          Copy-Item -LiteralPath $manifestSource -Destination $manifestDestination -Force

          $readmePath = Join-Path $PWD 'scoop-bucket/README.md'
          $readme = [IO.File]::ReadAllText($readmePath).ReplaceLineEndings("`n")
          if (!$readme.Contains('| [picket](https://github.com/willibrandon/picket) |', [StringComparison]::Ordinal)) {
            $replacements = @(
              @{
                Old = "scoop install scout`n"
                New = "scoop install picket`nscoop install scout`n"
              },
              @{
                Old = "scoop update scout`n"
                New = "scoop update picket`nscoop update scout`n"
              },
              @{
                Old = '| [scout](https://github.com/willibrandon/scout) | Feature-complete port of ripgrep to .NET Native AOT |'
                New = "| [picket](https://github.com/willibrandon/picket) | Native AOT secrets scanner |`n| [scout](https://github.com/willibrandon/scout) | Feature-complete port of ripgrep to .NET Native AOT |"
              }
            )

            foreach ($replacement in $replacements) {
              if (!$readme.Contains($replacement.Old, [StringComparison]::Ordinal)) {
                throw "Scoop README marker was not found: $($replacement.Old)"
              }

              $readme = $readme.Replace($replacement.Old, $replacement.New, [StringComparison]::Ordinal)
            }

            [IO.File]::WriteAllText($readmePath, $readme, [Text.UTF8Encoding]::new($false))
          }

      - name: Validate Scoop manifest
        shell: pwsh
        run: |
          $manifest = Get-Content -LiteralPath scoop-bucket/bucket/picket.json -Raw | ConvertFrom-Json -Depth 20
          $version = $env:RELEASE_TAG.TrimStart('v', 'V')
          if ($manifest.version -ne $version) {
            throw "Scoop manifest version '$($manifest.version)' does not match '$version'."
          }

          if ($manifest.bin.Count -ne 2 -or $manifest.bin[0][1] -ne 'picket' -or $manifest.bin[1][1] -ne 'picket-tui') {
            throw 'Scoop manifest does not expose both Picket commands.'
          }

      - name: Commit and push Scoop bucket
        shell: pwsh
        run: |
          git -C scoop-bucket config user.name 'github-actions[bot]'
          git -C scoop-bucket config user.email 'github-actions[bot]@users.noreply.github.com'
          git -C scoop-bucket add bucket/picket.json README.md
          git -C scoop-bucket diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Scoop bucket is already current.'
            exit 0
          }

          $version = $env:RELEASE_TAG.TrimStart('v', 'V')
          git -C scoop-bucket commit -m "Update picket to $version"
          git -C scoop-bucket push origin HEAD:main

  submit-winget:
    name: Submit WinGet manifest
    if: ${{ !contains(github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name, '-') }}
    needs:
      - publish-nuget
      - publish-release
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out WinGet fork
        uses: actions/checkout@v7.0.1
        with:
          repository: willibrandon/winget-pkgs
          ref: master
          fetch-depth: 1
          sparse-checkout: manifests/w/willibrandon/picket
          token: ${{ secrets.WINGET_PKGS_TOKEN }}
          path: winget-pkgs

      - name: Download generated package-manager manifests
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $downloadDirectory = Join-Path $env:RUNNER_TEMP 'picket-package-managers'
          $manifestDirectory = Join-Path $env:RUNNER_TEMP 'picket-package-manager-manifests'
          New-Item -ItemType Directory -Force -Path $downloadDirectory | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern "picket-$env:RELEASE_TAG-package-manager-manifests.zip" --dir $downloadDirectory
          if ($LASTEXITCODE -ne 0) {
            throw 'Package-manager manifest download failed.'
          }

          $archive = Get-ChildItem -LiteralPath $downloadDirectory -Filter '*.zip' -File -ErrorAction Stop
          if ($archive.Count -ne 1) {
            throw "Expected one package-manager manifest archive; found $($archive.Count)."
          }

          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $manifestDirectory -Force
          "PICKET_PACKAGE_MANAGER_MANIFESTS=$manifestDirectory" >> $env:GITHUB_ENV

      - name: Install WinGet manifest validator
        shell: pwsh
        run: |
          Install-Module `
            -Name Microsoft.WinGet.Client `
            -RequiredVersion '1.29.280' `
            -Repository PSGallery `
            -Scope CurrentUser `
            -Force
          Import-Module Microsoft.WinGet.Client -RequiredVersion '1.29.280' -Force
          Repair-WinGetPackageManager -Version 'v1.29.280' -Force

          $version = winget --version
          if ($LASTEXITCODE -ne 0 -or $version.Trim() -ne 'v1.29.280') {
            throw "Expected WinGet v1.29.280; found '$version'."
          }

      - name: Validate WinGet manifest
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v', 'V')
          $manifestDirectory = Join-Path $env:PICKET_PACKAGE_MANAGER_MANIFESTS "winget/willibrandon.picket/$version"
          if (!(Test-Path -LiteralPath $manifestDirectory -PathType Container)) {
            throw "Generated WinGet manifest directory was not found: $manifestDirectory"
          }

          winget validate --manifest $manifestDirectory --disable-interactivity
          if ($LASTEXITCODE -ne 0) {
            throw "WinGet manifest validation failed with exit code $LASTEXITCODE."
          }

          "PICKET_WINGET_MANIFESTS=$manifestDirectory" >> $env:GITHUB_ENV

      - name: Push WinGet submission branch
        id: winget-branch
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v', 'V')
          $branch = "picket-$version"
          $targetDirectory = Join-Path $PWD "winget-pkgs/manifests/w/willibrandon/picket/$version"

          git -C winget-pkgs remote get-url upstream >$null 2>$null
          if ($LASTEXITCODE -ne 0) {
            git -C winget-pkgs remote add upstream https://github.com/microsoft/winget-pkgs.git
          }

          git -C winget-pkgs fetch upstream master --depth=1
          git -C winget-pkgs checkout -B $branch upstream/master
          New-Item -ItemType Directory -Force -Path $targetDirectory | Out-Null
          Copy-Item -Path (Join-Path $env:PICKET_WINGET_MANIFESTS '*') -Destination $targetDirectory -Force

          git -C winget-pkgs config user.name 'github-actions[bot]'
          git -C winget-pkgs config user.email 'github-actions[bot]@users.noreply.github.com'
          git -C winget-pkgs add "manifests/w/willibrandon/picket/$version"
          git -C winget-pkgs diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'WinGet manifest is already present upstream.'
            "changed=false" >> $env:GITHUB_OUTPUT
            "branch=$branch" >> $env:GITHUB_OUTPUT
            exit 0
          }

          git -C winget-pkgs commit -m "Add willibrandon.picket $version"
          git -C winget-pkgs push origin "HEAD:refs/heads/$branch" --force
          "changed=true" >> $env:GITHUB_OUTPUT
          "branch=$branch" >> $env:GITHUB_OUTPUT

      - name: Create or reuse WinGet pull request
        if: steps.winget-branch.outputs.changed == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.WINGET_PKGS_TOKEN }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v', 'V')
          $branch = '${{ steps.winget-branch.outputs.branch }}'
          $existing = gh pr list --repo microsoft/winget-pkgs --state open --base master --head "willibrandon:$branch" --json url --jq '.[0].url'
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not query existing WinGet pull requests.'
          }

          if (![string]::IsNullOrWhiteSpace($existing)) {
            Write-Host "WinGet pull request already exists: $existing"
            exit 0
          }

          $title = "New package: willibrandon.picket version $version"
          $body = "Adds Picket $version from https://github.com/willibrandon/picket/releases/tag/$env:RELEASE_TAG."
          gh pr create --repo microsoft/winget-pkgs --base master --head "willibrandon:$branch" --title $title --body $body
          if ($LASTEXITCODE -ne 0) {
            throw 'WinGet pull request creation failed.'
          }

  publish-container-latest:
    name: Publish latest container tag
    if: ${{ !contains(github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name, '-') }}
    needs:
      - publish-container
      - publish-nuget
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      - name: Advance latest tag
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG
          if ($version.StartsWith('v', [StringComparison]::OrdinalIgnoreCase)) {
            $version = $version.Substring(1)
          }

          $repository = $env:GITHUB_REPOSITORY.ToLowerInvariant()
          $image = "ghcr.io/$repository"
          docker buildx imagetools create --tag "$image`:latest" "$image`:$version"
          if ($LASTEXITCODE -ne 0) {
            throw 'Latest container tag publish failed.'
          }

          docker buildx imagetools inspect "$image`:latest"

  publish-azure-devops-marketplace:
    name: Publish Azure DevOps Marketplace extension
    if: ${{ !contains(github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name, '-') }}
    needs:
      - publish-container-latest
      - submit-winget
      - update-homebrew
      - update-scoop
    runs-on: ubuntu-latest
    permissions:
      attestations: read
      contents: read
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.301

      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: azure-devops/package-lock.json

      - name: Install Azure DevOps publishing dependencies
        working-directory: azure-devops
        run: |
          npm ci --ignore-scripts --no-fund
          npm audit --audit-level=low

      - name: Download release VSIX
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assetName = "picket-$env:RELEASE_TAG-azure-devops.vsix"
          $outputDirectory = Join-Path $env:RUNNER_TEMP 'picket-marketplace-release'
          New-Item -ItemType Directory -Force -Path $outputDirectory | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern $assetName --pattern "$assetName.sha256" --dir $outputDirectory
          if ($LASTEXITCODE -ne 0) {
            throw 'Azure DevOps Marketplace asset download failed.'
          }

          "PICKET_VSIX_PATH=$(Join-Path $outputDirectory $assetName)" >> $env:GITHUB_ENV
          "PICKET_VSIX_CHECKSUM_PATH=$(Join-Path $outputDirectory "$assetName.sha256")" >> $env:GITHUB_ENV

      - name: Build Marketplace release verifier
        run: dotnet build ./scripts/Validate-MarketplaceRelease.cs --nologo --verbosity quiet

      - name: Verify VSIX checksum and metadata
        shell: pwsh
        run: dotnet run --file ./scripts/Validate-MarketplaceRelease.cs --no-build -- -ReleaseTag $env:RELEASE_TAG -VsixPath $env:PICKET_VSIX_PATH -ChecksumPath $env:PICKET_VSIX_CHECKSUM_PATH

      - name: Verify VSIX artifact attestation
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify $env:PICKET_VSIX_PATH --repo $env:GITHUB_REPOSITORY

      - name: Publish Azure DevOps extension
        shell: pwsh
        env:
          AZURE_DEVOPS_MARKETPLACE_PAT: ${{ secrets.AZURE_DEVOPS_MARKETPLACE_PAT }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AZURE_DEVOPS_MARKETPLACE_PAT)) {
            throw 'AZURE_DEVOPS_MARKETPLACE_PAT is required for Azure DevOps Marketplace publication.'
          }

          $version = $env:RELEASE_TAG.TrimStart('v', 'V')
          Push-Location azure-devops
          try {
            $extensionJson = npm exec -- tfx extension show --publisher willibrandon --extension-id picket --token $env:AZURE_DEVOPS_MARKETPLACE_PAT --json --no-prompt --no-color
            if ($LASTEXITCODE -ne 0) {
              throw 'Could not query the existing Azure DevOps Marketplace extension.'
            }

            $extension = $extensionJson | ConvertFrom-Json -Depth 100
            $publishedVersions = @($extension.versions | ForEach-Object { $_.version })
            if ($publishedVersions -contains $version) {
              Write-Host "Azure DevOps Marketplace extension $version is already published."
              exit 0
            }

            npm exec -- tfx extension publish --vsix $env:PICKET_VSIX_PATH --token $env:AZURE_DEVOPS_MARKETPLACE_PAT --no-prompt --no-color
            if ($LASTEXITCODE -ne 0) {
              throw "Azure DevOps Marketplace publication failed with exit code $LASTEXITCODE."
            }
          }
          finally {
            Pop-Location
          }

  publish-github-action:
    name: Advance GitHub Action release channel
    if: ${{ !contains(github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name, '-') }}
    needs: publish-azure-devops-marketplace
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Advance GitHub Action major tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw "GitHub Marketplace publication requires a stable canonical release tag; received '$env:RELEASE_TAG'."
          }

          $majorTag = "v$($Matches[1])"
          $releaseCommit = (git rev-parse "$env:RELEASE_TAG^{commit}").Trim()
          $referencePath = "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$majorTag"
          $existingReference = gh api $referencePath --jq '.object.sha' 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh api --method POST "repos/$env:GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$majorTag" -f sha=$releaseCommit >$null
          }
          elseif ($existingReference -ne $releaseCommit) {
            gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$majorTag" -f sha=$releaseCommit -F force=true >$null
          }

          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Action major tag '$majorTag' could not be advanced to '$releaseCommit'."
          }

          "GitHub Action tag ``$majorTag`` now targets ``$releaseCommit``." >> $env:GITHUB_STEP_SUMMARY

  verify-github-marketplace:
    name: Verify GitHub Marketplace listing
    if: ${{ !contains(github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name, '-') }}
    needs: publish-github-action
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify immutable release is listed
        shell: pwsh
        run: |
          $marketplaceUrl = "https://github.com/marketplace/actions/picket-secret-scanner"
          $releaseEditUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/edit/$env:RELEASE_TAG"
          $repositoryLink = "href=`"/$env:GITHUB_REPOSITORY`""

          for ($attempt = 1; $attempt -le 12; $attempt++) {
            $response = Invoke-WebRequest -Uri $marketplaceUrl -MaximumRedirection 3 -SkipHttpErrorCheck
            if ($response.StatusCode -eq 200 -and
                $response.Content.Contains($repositoryLink, [StringComparison]::OrdinalIgnoreCase) -and
                $response.Content.Contains($env:RELEASE_TAG, [StringComparison]::Ordinal)) {
              "GitHub Marketplace lists [$env:GITHUB_REPOSITORY $env:RELEASE_TAG]($marketplaceUrl)." >> $env:GITHUB_STEP_SUMMARY
              exit 0
            }

            if ($attempt -lt 12) {
              Start-Sleep -Seconds 10
            }
          }

          throw "GitHub Marketplace does not list $env:GITHUB_REPOSITORY release $env:RELEASE_TAG. GitHub requires a repository owner to edit the release, select 'Publish this Action to the GitHub Marketplace', choose categories, accept the Marketplace Developer Agreement when prompted, and complete two-factor authentication. Edit the release at $releaseEditUrl and rerun this job."
