name: Picket Secret Scanner
description: Scan a repository or container image with Picket and publish SARIF-ready results.
author: willibrandon

branding:
  icon: shield
  color: green

inputs:
  path:
    description: Repository path to scan. Mutually exclusive with docker-archive, oci-archive, and registry-image. Empty defaults to the GitHub workspace when no other source is selected.
    required: false
    default: ""
  docker-archive:
    description: Docker image archive produced by docker save. Relative paths resolve from the GitHub workspace.
    required: false
    default: ""
  oci-archive:
    description: OCI image-layout archive. Relative paths resolve from the GitHub workspace.
    required: false
    default: ""
  registry-image:
    description: OCI or Docker registry image reference, including Docker Hub shorthand.
    required: false
    default: ""
  registry-endpoint:
    description: Optional OCI Distribution API endpoint override. Requires registry-image.
    required: false
    default: ""
  registry-auth-endpoint:
    description: Optional explicitly trusted cross-host bearer-token endpoint. Requires registry-image.
    required: false
    default: ""
  registry-token-env:
    description: Environment variable containing a pre-issued registry bearer token. Requires registry-image and cannot be combined with Basic authentication inputs.
    required: false
    default: ""
  registry-username-env:
    description: Environment variable containing the registry username. Requires registry-image and registry-password-env.
    required: false
    default: ""
  registry-password-env:
    description: Environment variable containing the registry password or personal access token. Requires registry-image and registry-username-env.
    required: false
    default: ""
  registry-platform:
    description: Optional os/architecture[/variant] selector for a multi-platform registry image.
    required: false
    default: ""
  registry-max-image-megabytes:
    description: Optional positive aggregate download cap for unique image manifests, configs, and layers in decimal MB.
    required: false
    default: ""
  allow-non-public-source-endpoints:
    description: Permit private, loopback, link-local, or otherwise non-public registry endpoint addresses.
    required: false
    default: "false"
  allow-insecure-source-endpoints:
    description: Permit HTTP registry endpoints for explicitly trusted environments. Credentials may be sent in cleartext.
    required: false
    default: "false"
  config-path:
    description: Optional config path. A custom config replaces Picket's embedded native default rules; extend.useDefault restores only the Gitleaks defaults.
    required: false
    default: ""
  baseline-path:
    description: Optional Gitleaks-compatible baseline path.
    required: false
    default: ""
  ignore-path:
    description: Optional .picketignore path containing native stable finding fingerprints or content hashes.
    required: false
    default: ""
  rule-packs:
    description: Optional comma-separated built-in rule packs. Values are picket-strict and picket-experimental.
    required: false
    default: ""
  cache:
    description: Restore and save the native Picket scan cache.
    required: false
    default: "true"
  cache-mode:
    description: Native scan cache storage mode. Use secret-hash-only for public CI safety or raw for exact cached report replay in trusted jobs.
    required: false
    default: secret-hash-only
  cache-path:
    description: Native Picket scan cache directory. Empty uses the runner temporary directory.
    required: false
    default: ""
  cache-key:
    description: Optional explicit cache key.
    required: false
    default: ""
  report-directory:
    description: Directory where SARIF and JSONL reports are written. Empty uses the runner temporary directory.
    required: false
    default: ""
  fail-on:
    description: Failure mode. Use findings, errors, or never.
    required: false
    default: findings
  summary:
    description: Write the Picket scan job summary.
    required: false
    default: "true"
  results:
    description: Optional comma-separated validation result states to keep before reports, annotations, and failure enforcement.
    required: false
    default: ""
  only-verified:
    description: Keep only structurally valid offline findings and active live-verification findings.
    required: false
    default: "false"
  verify:
    description: Enable opt-in live provider verification.
    required: false
    default: "false"
  live-max-requests:
    description: Maximum outbound live-verification requests per scan.
    required: false
    default: "100"
  live-max-requests-per-provider:
    description: Maximum outbound live-verification requests for any one provider per scan.
    required: false
    default: "25"
  upload-sarif:
    description: Upload the SARIF report through GitHub code scanning.
    required: false
    default: "false"
  annotations:
    description: Emit safe GitHub workflow annotations from JSONL findings.
    required: false
    default: "true"
  annotation-limit:
    description: Maximum number of workflow annotations to emit.
    required: false
    default: "50"
  redact:
    description: Redaction percentage from 0 through 100. Defaults to full redaction for public CI safety.
    required: false
    default: "100"
  max-target-megabytes:
    description: Optional maximum file size in decimal MB for content rules.
    required: false
    default: ""
  timeout:
    description: Optional scan timeout in seconds. Use 0 to disable.
    required: false
    default: ""
  max-archive-depth:
    description: Optional maximum nested archive traversal depth. Use 0 to disable.
    required: false
    default: ""
  max-archive-entries:
    description: Optional maximum number of files extracted from archives. Use 0 to disable.
    required: false
    default: ""
  max-archive-megabytes:
    description: Optional maximum decompressed archive payload in decimal MB.
    required: false
    default: ""
  max-archive-ratio:
    description: Optional maximum archive expansion ratio. Use 0 to disable.
    required: false
    default: ""
  dotnet-version:
    description: .NET SDK version used to run the source-based action.
    required: false
    default: 10.0.302
  setup-dotnet:
    description: Install the configured .NET SDK before running Picket.
    required: false
    default: "true"

outputs:
  exit-code:
    description: Raw Picket scanner exit code.
    value: ${{ steps.run.outputs.exit-code }}
  findings:
    description: Number of JSONL finding records emitted by Picket.
    value: ${{ steps.run.outputs.findings }}
  sarif-path:
    description: SARIF report path.
    value: ${{ steps.run.outputs.sarif-path }}
  jsonl-path:
    description: JSONL report path.
    value: ${{ steps.run.outputs.jsonl-path }}
  annotations:
    description: Number of workflow annotations emitted.
    value: ${{ steps.run.outputs.annotations }}

runs:
  using: composite
  steps:
    - name: Set up .NET
      if: ${{ inputs.setup-dotnet == 'true' }}
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    - name: Restore Picket
      shell: pwsh
      working-directory: ${{ github.action_path }}
      run: dotnet restore "$env:GITHUB_ACTION_PATH/Picket.slnx" --locked-mode

    - name: Restore scan cache
      id: cache-restore
      if: ${{ inputs.cache == 'true' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.cache-path != '' && inputs.cache-path || format('{0}/picket-cache', runner.temp) }}
        key: ${{ inputs.cache-key != '' && inputs.cache-key || format('picket-{0}-{1}-{2}-{3}', runner.os, inputs.cache-mode, github.ref_name, github.sha) }}
        restore-keys: |
          ${{ inputs.cache-key != '' && inputs.cache-key || format('picket-{0}-{1}-{2}-', runner.os, inputs.cache-mode, github.ref_name) }}
          picket-${{ runner.os }}-${{ inputs.cache-mode }}-

    - name: Run Picket
      id: run
      shell: pwsh
      working-directory: ${{ github.action_path }}
      env:
        PICKET_PATH: ${{ inputs.path }}
        PICKET_DOCKER_ARCHIVE: ${{ inputs.docker-archive }}
        PICKET_OCI_ARCHIVE: ${{ inputs.oci-archive }}
        PICKET_REGISTRY_IMAGE: ${{ inputs.registry-image }}
        PICKET_REGISTRY_ENDPOINT: ${{ inputs.registry-endpoint }}
        PICKET_REGISTRY_AUTH_ENDPOINT: ${{ inputs.registry-auth-endpoint }}
        PICKET_REGISTRY_TOKEN_ENV: ${{ inputs.registry-token-env }}
        PICKET_REGISTRY_USERNAME_ENV: ${{ inputs.registry-username-env }}
        PICKET_REGISTRY_PASSWORD_ENV: ${{ inputs.registry-password-env }}
        PICKET_REGISTRY_PLATFORM: ${{ inputs.registry-platform }}
        PICKET_REGISTRY_MAX_IMAGE_MEGABYTES: ${{ inputs.registry-max-image-megabytes }}
        PICKET_ALLOW_NON_PUBLIC_SOURCE_ENDPOINTS: ${{ inputs.allow-non-public-source-endpoints }}
        PICKET_ALLOW_INSECURE_SOURCE_ENDPOINTS: ${{ inputs.allow-insecure-source-endpoints }}
        PICKET_CONFIG_PATH: ${{ inputs.config-path }}
        PICKET_BASELINE_PATH: ${{ inputs.baseline-path }}
        PICKET_IGNORE_PATH: ${{ inputs.ignore-path }}
        PICKET_RULE_PACKS: ${{ inputs.rule-packs }}
        PICKET_CACHE_ENABLED: ${{ inputs.cache }}
        PICKET_CACHE_MODE: ${{ inputs.cache-mode }}
        PICKET_CACHE_PATH: ${{ inputs.cache-path }}
        PICKET_REPORT_DIRECTORY: ${{ inputs.report-directory }}
        PICKET_FAIL_ON: ${{ inputs.fail-on }}
        PICKET_SUMMARY: ${{ inputs.summary }}
        PICKET_RESULTS: ${{ inputs.results }}
        PICKET_ONLY_VERIFIED: ${{ inputs.only-verified }}
        PICKET_VERIFY: ${{ inputs.verify }}
        PICKET_LIVE_MAX_REQUESTS: ${{ inputs.live-max-requests }}
        PICKET_LIVE_MAX_REQUESTS_PER_PROVIDER: ${{ inputs.live-max-requests-per-provider }}
        PICKET_ANNOTATIONS: ${{ inputs.annotations }}
        PICKET_ANNOTATION_LIMIT: ${{ inputs.annotation-limit }}
        PICKET_REDACT: ${{ inputs.redact }}
        PICKET_MAX_TARGET_MEGABYTES: ${{ inputs.max-target-megabytes }}
        PICKET_TIMEOUT: ${{ inputs.timeout }}
        PICKET_MAX_ARCHIVE_DEPTH: ${{ inputs.max-archive-depth }}
        PICKET_MAX_ARCHIVE_ENTRIES: ${{ inputs.max-archive-entries }}
        PICKET_MAX_ARCHIVE_MEGABYTES: ${{ inputs.max-archive-megabytes }}
        PICKET_MAX_ARCHIVE_RATIO: ${{ inputs.max-archive-ratio }}
      run: |
        dotnet build "$env:GITHUB_ACTION_PATH/.github/actions/run-picket.cs" --nologo --verbosity quiet
        dotnet run --file "$env:GITHUB_ACTION_PATH/.github/actions/run-picket.cs" --no-build

    - name: Save scan cache
      if: ${{ inputs.cache == 'true' && steps.cache-restore.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.cache-path != '' && inputs.cache-path || format('{0}/picket-cache', runner.temp) }}
        key: ${{ inputs.cache-key != '' && inputs.cache-key || format('picket-{0}-{1}-{2}-{3}', runner.os, inputs.cache-mode, github.ref_name, github.sha) }}

    - name: Upload SARIF
      if: ${{ inputs.upload-sarif == 'true' && steps.run.outputs.sarif-path != '' }}
      uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
      with:
        sarif_file: ${{ steps.run.outputs.sarif-path }}

    - name: Enforce fail mode
      if: ${{ steps.run.outputs.should-fail == 'true' }}
      shell: pwsh
      env:
        PICKET_FAILURE_CODE: ${{ steps.run.outputs.failure-code }}
      run: exit ([int]$env:PICKET_FAILURE_CODE)
